<!DOCTYPE html>
<html>
<head>
  <title>Pappu Watch</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: black;
      padding: 15px;
      font-size: 22px;
      border-bottom: 1px solid gold;
      color: gold;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 5px gold, 0 0 10px gold;
    }

    .hero {
      padding: 20px;
    }

    .hero h1 {
      color: gold;
    }

    /* SLIDER */
    .slider {
      width: 100%;
      overflow: hidden;
      margin: 20px 0;
    }

    .slides {
      display: flex;
      width: 300%;
      animation: slide 9s infinite;
    }

    .slides img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    @keyframes slide {
      0% { transform: translateX(0%); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(0%); }
    }

    .products {
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      margin: 20px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px gold;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px gold;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      color: gold;
      font-weight: bold;
      margin: 10px 0;
    }

    .whatsapp-btn {
      background: gold;
      color: black;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    .whatsapp-btn:hover {
      background: #ffcc00;
    }
  </style>
</head>

<body>

  <header>
    ⌚ PAPPU WATCH
  </header>

  <div class="hero">
    <h1>Upgrade Your Style 💎</h1>
    <p>Premium Watches at Best Price</p>
  </div>

  <!-- SLIDER -->
  <div class="slider">
    <div class="slides">
      <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260420-WA0000.jpg" alt="watch1">
      <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260420-WA0000.jpg" alt="watch2">
      <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260420-WA0000.jpg" alt="watch3">
    </div>
  </div>

  <div class="products">

    <!-- PRODUCT 1 -->
    <div class="card">
      <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260420-WA0000.jpg" alt="Tissot">
      <h3>Tissot 1853</h3>
      <p class="price">₹2499</p>
      <a class="whatsapp-btn" href="https://wa.me/919204555947" target="_blank">Order on WhatsApp</a>
    </div>

    <!-- PRODUCT 2 -->
    <div class="card">
      <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260420-WA0000.jpg" alt="Rolex">
      <h3>Rolex Style Watch</h3>
      <p class="price">₹1999</p>
      <a class="whatsapp-btn" href="https://wa.me/919204555947" target="_blank">Order on WhatsApp</a>
    </div>

  </div>

</body>
</html>
