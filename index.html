<!DOCTYPE html>
<html>
<head>
  <title>Pappu Watch</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: black;
      padding: 15px;
      font-size: 22px;
      border-bottom: 1px solid gold;
    }

    .hero {
      padding: 30px;
    }

    .hero h1 {
      color: gold;
    }

    .products {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: #1c1c1c;
      margin: 20px;
      padding: 15px;
      border-radius: 12px;
      width: 90%;
      box-shadow: 0 0 15px gold;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      color: gold;
      font-size: 18px;
    }

    button {
      background: gold;
      border: none;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<header>⌚ PAPPU WATCH</header>

<div class="hero">
  <h1>Upgrade Your Style 💎</h1>
  <p>Premium Watches at Best Price</p>
</div>

<div class="products">

  <!-- PRODUCT 1 -->
  <div class="card">
    <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260412-WA0017.jpg" />
    <h3>Tissot 1853</h3>
    <p class="price">₹2499</p>

    <a href="https://wa.me/919204555947?text=I%20want%20to%20order%20Tissot%201853">
      <button>Order on WhatsApp</button>
    </a>
  </div>

  <!-- PRODUCT 2 -->
  <div class="card">
    <img src="https://i.ibb.co/qYYkQ1M4/IMG-20260412-WA0017.jpg" />
    <h3>Rolex Style Watch</h3>
    <p class="price">₹1999</p>

    <a href="https://wa.me/919204555947?text=I%20want%20to%20order%20Rolex%20Watch">
      <button>Order on WhatsApp</button>
    </a>
  </div>

</div>

</body>
</html>
.logo {
  font-size: 28px;
  font-weight: bold;
  color: gold;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 
    0 0 5px gold,
    0 0 10px gold,
    0 0 20px #ffcc00;
}
